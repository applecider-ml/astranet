[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astranet"
version = "1.0.0"
description = "ASTRANet: spectroscopic classification and object-level novelty detection for transients"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Argyro Sasli" }]
dependencies = ["torch>=2.2", "numpy>=1.24", "scipy>=1.11", "pyyaml>=6.0"]

[project.optional-dependencies]
novelty = ["scikit-learn>=1.5", "joblib>=1.3", "luna-ood @ git+https://github.com/asasli/luna"]
train = ["pandas>=2.0", "scikit-learn>=1.5", "lightgbm>=4.0", "tqdm>=4.65", "matplotlib>=3.7", "seaborn>=0.13", "umap-learn>=0.5", "plotly>=5.0",
         "luna-ood @ git+https://github.com/asasli/luna"]

[project.scripts]
astranet-skyportal = "astranet.skyportal:main"

[tool.setuptools.packages.find]
include = ["astranet*"]
