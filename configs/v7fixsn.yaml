# ASTRAnet — v7fixmd recipe with the SpectraNet backbone (Xu et al. 2026) replacing stem + dilated TCN.
# Everything else (FiLM metadata conditioning, hierarchical heads, losses, metadata dropout, split) unchanged.
# Data paths resolve inside data/ ; retrain with pipelines/train_seeds.py.

# ── Data (external — not committed) ───────────────────────────────
data:
  dir:    data/object-split-v7fix     # canonical object-level split
  rare_pt: data/rare_unknown.pt

# ── Class set ─────────────────────────────────────────────────────
# with_ia_pec: raw `Ia-pec` maps to `Ia` (consistent with the v7new split, where
# every peculiar-Ia subtype was folded into Ia). Used for EVAL label mapping only;
# training reads the pre-computed `y` from the split.
class_set: with_ia_pec

# ── Training ──────────────────────────────────────────────────────
seeds: [42, 123, 7]
gpu_id: 0
backbone: spectranet
train_out: trained_v7fixsn      # -> models/trained_v7fix/seed<seed>/

# ── Metadata dropout (training only) ─────────────────────────────
# production challenging set: z missing for 56% of spectra, phase for 40%
meta_dropout:
  z: 0.4
  phase: 0.3

# ── Ensemble ──────────────────────────────────────────────────────
ensemble: v7fixsn6              # 6model composition, own namespace
weights_source: trained_v7fixsn

# ── Anomaly detection ─────────────────────────────────────────────
target_far: 0.01
combiner: lightgbm

# ── Conformal ─────────────────────────────────────────────────────
alpha: 0.05
n_quintiles: 5
n_folds: 5

# observed-frame input moved to the rest frame inside the network when z is known
z_shift: true
