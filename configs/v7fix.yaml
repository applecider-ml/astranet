# ASTRAnet — canonical configuration (object-split-v7fix)
# Data paths resolve inside data/ ; retrain with pipelines/train_seeds.py.

# ── Data (external — not committed) ───────────────────────────────
data:
  dir:    data/object-split-v7fix     # canonical object-level split
  rare_pt: data/rare_unknown.pt

# ── Class set ─────────────────────────────────────────────────────
# with_ia_pec: raw `Ia-pec` maps to `Ia` (consistent with the v7new split, where
# every peculiar-Ia subtype was folded into Ia). Used for EVAL label mapping only;
# training reads the pre-computed `y` from the split.
class_set: with_ia_pec

# ── Training ──────────────────────────────────────────────────────
seeds: [42, 123, 7]
gpu_id: 0
train_out: trained_v7fix       # -> models/trained_v7fix/seed<seed>/

# ── Ensemble ──────────────────────────────────────────────────────
ensemble: v7fix6               # 6model composition, own namespace
weights_source: trained_v7fix

# ── Anomaly detection ─────────────────────────────────────────────
target_far: 0.01
combiner: lightgbm

# ── Conformal ─────────────────────────────────────────────────────
alpha: 0.05
n_quintiles: 5
n_folds: 5
